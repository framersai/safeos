# Serves the Next.js static export (apps/guardian-ui, output: 'export').
# Routes are built with trailingSlash: true, so each page is a directory with
# its own index.html.
server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Immutable Next.js build assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static export: try the exact file, then the directory index, then the
    # .html sibling, then fall back to the exported 404 page.
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
}
