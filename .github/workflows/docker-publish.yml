# SafeOS Guardian - publish container images to GHCR.
# Publishes ghcr.io/framersai/safeos-api (backend) and
# ghcr.io/framersai/safeos-ui (frontend static export) on every push to
# master that touches code/Docker, and on manual dispatch.
#
# Auth uses the built-in GITHUB_TOKEN (no extra secret). The first run creates
# the packages as PRIVATE - make them public once in the org's package settings.

name: Publish Docker images

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & push (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend
            image: safeos-api
          - target: frontend
            image: safeos-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* are inlined into the static export at build time. The
          # published ui image targets local trial (compose maps the API to
          # localhost:3001). Production deployments rebuild with their own URL.
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
            NEXT_PUBLIC_WS_URL=ws://localhost:3001
          cache-from: type=gha
          cache-to: type=gha,mode=max
